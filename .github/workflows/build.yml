name: Build and inspect source

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  inspect-original:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Decompile original Cyber Village JAR
        run: |
          curl --fail --location --retry 3 --output cfr.jar https://repo.maven.apache.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar
          mkdir -p decompiled
          java -jar cfr.jar cybervillage-1.4.0.jar --outputdir decompiled --silent true
          unzip -p cybervillage-1.4.0.jar META-INF/mods.toml > decompiled/original-mods.toml
          unzip -p cybervillage-1.4.0.jar META-INF/MANIFEST.MF > decompiled/original-manifest.mf
          find decompiled -type f | sort > decompiled-file-list.txt
          test -s decompiled-file-list.txt
      - name: Publish decompiled source to inspection branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan inspection/decompiled-original
          git rm -rf . >/dev/null 2>&1 || true
          git add decompiled decompiled-file-list.txt
          git commit -m "Add decompiled original source for port inspection"
          git push --force origin HEAD:inspection/decompiled-original
      - name: Upload decompiled source for porting
        uses: actions/upload-artifact@v4
        with:
          name: cybervillage-original-decompiled-source
          path: |
            decompiled/
            decompiled-file-list.txt
          if-no-files-found: error
          retention-days: 30

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile scaffold only (not a playable release)
        run: gradle build --no-daemon
